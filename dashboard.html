<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-page">

    <!-- Add / Edit Form -->
    <div class="dashboard-container">
      <h2 id="formTitle">Add New Product</h2>
      <p>Enter Product Details Below</p>

      <form id="productForm">
        <label>Product Title</label>
        <input
          type="text"
          id="productTitle"
          placeholder="Enter Product Title"
          required
        />

        <label>Product Image</label>
        <input type="file" id="productImage" accept="image/*" required />
        <small id="imageHint" class="image-hint">
          Naya image na chuno to purani image hi rahegi.
        </small>

        <label>Product Description</label>
        <textarea
          id="productDescription"
          placeholder="Enter Product Description"
          required
        ></textarea>

        <label>Product Category</label>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Shoes">Shoes</option>
          <option value="Accessories">Accessories</option>
        </select>

        <label>Product Price</label>
        <input
          type="number"
          id="productPrice"
          placeholder="Enter Product Price"
          min="1"
          required
        />

        <button type="submit" id="submitBtn">Add Product</button>
        <button type="button" id="cancelEdit" class="cancel-btn">Cancel Edit</button>
      </form>
    </div>

    <!-- Added Products List -->
    <div class="admin-products">
      <h2>Added Products</h2>
      <div id="adminProductList"></div>

      <div class="next-wrap">
        <a href="index.html" class="next-btn">Next &rarr;</a>
      </div>
    </div>

    <script src="js/products.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
